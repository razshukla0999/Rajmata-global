<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDX | GLOBAL EMPIRE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

    <style>
        :root { --redx: #ff0000; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* Navigation */
        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { font-size: 1.8rem; color: #666; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #fff; text-shadow: 0 0 10px #fff; }

        /* Reels Section */
        #feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        #feed::-webkit-scrollbar { display: none; }
        .reel { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .overlay { position: absolute; bottom: 90px; left: 20px; z-index: 10; }
        .sidebar { position: absolute; right: 20px; bottom: 150px; display: flex; flex-direction: column; gap: 25px; align-items: center; }

        /* Login Modal */
        #login-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: #111; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #333; }
        .g-btn { background: #fff; color: #000; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="feed"></div>

    <nav>
        <div class="nav-item active">🏠</div>
        <div class="nav-item">🔍</div>
        <div class="nav-item" onclick="app.showLogin()">➕</div>
        <div class="nav-item" onclick="app.showLogin()">👤</div>
    </nav>

    <div id="login-modal">
        <div class="login-card">
            <h1 style="color:var(--redx); font-size: 3rem;">REDX</h1>
            <p>Join the Elite Traders</p>
            <button class="g-btn" onclick="app.login()">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20"> Continue with Google
            </button>
            <p onclick="app.hideLogin()" style="color:#555; margin-top:15px; cursor:pointer;">Maybe Later</p>
        </div>
    </div>

    <script>
        // 🔱 ASALI CONFIG (Verified from your screenshots)
        const firebaseConfig = {
            apiKey: "AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
            authDomain: "red-x-global.firebaseapp.com",
            projectId: "red-x-global",
            storageBucket: "red-x-global.firebasestorage.app",
            messagingSenderId: "831636783622",
            appId: "1:831636783622:web:92271605a0dc5150123987"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const app = {
            data: [
                { user: 'RedX_Founder', desc: 'The Empire begins here... 🔱', url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4' },
                { user: 'Trading_Pro', desc: 'Market analysis for today! 📈', url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' }
            ],

            init: function() {
                this.render();
                this.observe();
            },

            render: function() {
                const feed = document.getElementById('feed');
                feed.innerHTML = this.data.map(r => `
                    <div class="reel">
                        <video loop playsinline onclick="this.paused ? this.play() : this.pause()">
                            <source src="${r.url}" type="video/mp4">
                        </video>
                        <div class="overlay">
                            <h3 style="color:var(--redx)">@${r.user}</h3>
                            <p>${r.desc}</p>
                        </div>
                        <div class="sidebar">
                            <div style="font-size:2rem">❤️</div>
                            <div style="font-size:2rem">💬</div>
                        </div>
                    </div>
                `).join('');
            },

            observe: function() {
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        const v = e.target.querySelector('video');
                        if(e.isIntersecting) { v.play().catch(()=>{}); }
                        else { v.pause(); }
                    });
                }, { threshold: 0.8 });
                document.querySelectorAll('.reel').forEach(r => obs.observe(r));
            },

            showLogin: () => document.getElementById('login-modal').style.display = 'flex',
            hideLogin: () => document.getElementById('login-modal').style.display = 'none',

            login: function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider)
                    .then(() => location.reload())
                    .catch(err => alert("Error: " + err.message));
            }
        };

        app.init();
    </script>
</body>
</html>
