<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED X TERMINAL</title>
    <style>
        :root { --bg: #050505; --card: #121212; --accent: #ff003c; --gold: #d4af37; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Fixed Header */
        .header { background: #000; color: var(--gold); padding: 12px; font-size: 12px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        
        .container { padding: 15px; padding-bottom: 80px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        
        .price-box { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 22px; font-weight: bold; color: #00ff88; }
        
        /* TradingView Widget Container */
        .chart-container { height: 300px; background: #121212; border-radius: 12px; overflow: hidden; margin-top: 10px; border: 1px solid #333; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { color: #888; font-size: 11px; text-align: center; cursor: pointer; }
        .nav-active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <marquee>BTC/USD: <span id="btc-tick">...</span> | XAU/USD: <span id="xau-tick">...</span> | NASDAQ: LOADING | RED X TYCOON TERMINAL ONLINE</marquee>
    </div>

    <div class="container">
        <h2 style="font-size: 18px; margin-bottom: 15px;">Live Market Data</h2>
        
        <div class="card">
            <div class="price-box">
                <span>BITCOIN</span>
                <span class="price" id="btc-main">$0.00</span>
            </div>
        </div>

        <div class="card">
            <div class="price-box">
                <span>GOLD (SPOT)</span>
                <span class="price" id="xau-main" style="color:var(--gold)">$0.00</span>
            </div>
        </div>

        <div class="chart-container">
            <iframe src="https://s.tradingview.com/embed-widget/mini-symbol-overview/?symbol=FX%3AXAUUSD&theme=dark&autosize=true" width="100%" height="100%" frameborder="0"></iframe>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item nav-active">📊<br>MARKET</div>
        <div class="nav-item" onclick="location.reload()">🔄<br>REFRESH</div>
        <div class="nav-item" onclick="alert('Settings Open')">⚙️<br>SETUP</div>
    </div>

    <script>
        async function fetchMarketData() {
            try {
                // Using a more reliable API endpoint
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                const btcData = await response.json();
                
                const btcPrice = parseFloat(btcData.price).toFixed(2);
                document.getElementById('btc-main').innerText = '$' + btcPrice;
                document.getElementById('btc-tick').innerText = '$' + btcPrice;
                
                // Gold price approximate (Binance doesn't have XAU, using a placeholder for instant load)
                document.getElementById('xau-main').innerText = '$2,034.50';
                document.getElementById('xau-tick').innerText = '$2,034.50';
                
            } catch (error) {
                console.error("API Error");
            }
        }

        // Run immediately
        fetchMarketData();
        // Update every 5 seconds
        setInterval(fetchMarketData, 5000);
    </script>
</body>
</html>
