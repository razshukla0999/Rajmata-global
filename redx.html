<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDX | INSTA-MODE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

    <style>
        :root { --redx: #ff3b3b; --ig-grey: #262626; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

        /* Reels Container */
        #reels-app { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        #reels-app::-webkit-scrollbar { display: none; }

        .reel-video-container { 
            height: 100vh; 
            width: 100vw; 
            scroll-snap-align: start; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* Instagram Style Overlay */
        .ui-overlay {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            z-index: 10;
        }

        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--redx); }
        .user-info span { font-weight: 600; font-size: 0.9rem; }
        .description { font-size: 0.85rem; opacity: 0.9; margin-left: 5px; }

        /* Sidebar Actions */
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 20;
        }
        .action-item { text-align: center; cursor: pointer; }
        .action-item i { font-size: 28px; display: block; margin-bottom: 5px; }
        .action-item span { font-size: 12px; font-weight: 400; }

        /* Bottom Nav */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #000;
            border-top: 0.5px solid #333;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-icon { font-size: 24px; color: #fff; opacity: 0.7; cursor: pointer; }
        .nav-icon.active { opacity: 1; }

        /* Login Modal */
        #login-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-box { background: #121212; padding: 40px; border-radius: 12px; text-align: center; width: 85%; max-width: 400px; border: 1px solid #333; }
        .google-login-btn { 
            background: #fff; color: #000; border: none; padding: 12px 24px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px;
            display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="reels-app"></div>

    <nav>
        <div class="nav-icon active">🏠</div>
        <div class="nav-icon">🔍</div>
        <div class="nav-icon" onclick="manager.showLogin()">➕</div>
        <div class="nav-icon" onclick="manager.showLogin()">👤</div>
    </nav>

    <div id="login-modal">
        <div class="login-box">
            <h2 style="margin-bottom: 10px; color: var(--redx)">REDX Empire</h2>
            <p style="color: #8e8e8e; font-size: 14px;">Login to interact with traders</p>
            <button class="google-login-btn" onclick="manager.login()">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="18">
                Continue with Google
            </button>
            <p style="margin-top: 20px; font-size: 12px; color: #555; cursor: pointer;" onclick="manager.hideLogin()">Not now</p>
        </div>
    </div>

    <script>
        // 🔱 DATABASE CONNECTION
        const firebaseConfig = {
            apiKey: "AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
            authDomain: "red-x-global.firebaseapp.com",
            projectId: "red-x-global",
            storageBucket: "red-x-global.firebasestorage.app",
            messagingSenderId: "831636783622",
            appId: "1:831636783622:web:92271605a0dc5150123987"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const manager = {
            // Infinite Reel Samples
            reelsData: [
                { id: 1, user: 'RedX_Master', desc: 'Breakout Strategy 2026 📈', video: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', likes: '12k' },
                { id: 2, user: 'Trading_King', desc: 'Price Action is God. 🔥', video: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', likes: '45k' },
                { id: 3, user: 'Market_Shark', desc: 'Discipline > Talent. 🔱', video: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', likes: '8k' }
            ],

            init: function() {
                this.render();
                this.setupObserver();
            },

            render: function() {
                const container = document.getElementById('reels-app');
                container.innerHTML = this.reelsData.map(reel => `
                    <div class="reel-video-container">
                        <video loop playsinline onclick="this.paused ? this.play() : this.pause()">
                            <source src="${reel.video}" type="video/mp4">
                        </video>
                        
                        <div class="sidebar">
                            <div class="action-item"><span>❤️</span><p>${reel.likes}</p></div>
                            <div class="action-item"><span>💬</span><p>234</p></div>
                            <div class="action-item"><span>✈️</span></div>
                            <div class="action-item"><span>...</span></div>
                        </div>

                        <div class="ui-overlay">
                            <div class="user-info">
                                <img src="https://ui-avatars.com/api/?name=${reel.user}&background=random">
                                <span>${reel.user} • Follow</span>
                            </div>
                            <p class="description">${reel.desc}</p>
                        </div>
                    </div>
                `).join('');
            },

            setupObserver: function() {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        const v = e.target.querySelector('video');
                        if(e.isIntersecting) { 
                            v.play().catch(() => {});
                            v.muted = false;
                        } else { 
                            v.pause(); 
                        }
                    });
                }, { threshold: 0.7 });
                document.querySelectorAll('.reel-video-container').forEach(r => observer.observe(r));
            },

            showLogin: () => document.getElementById('login-modal').style.display = 'flex',
            hideLogin: () => document.getElementById('login-modal').style.display = 'none',

            login: function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).then(() => {
                    location.reload();
                }).catch(err => alert("Access Denied: " + err.message));
            }
        };

        // Start App
        manager.init();
    </script>
</body>
</html>
