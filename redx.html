<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED X | Raz Global Network</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff003c">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0a0a0b; --surface: #121214; --accent: #ff003c; --gold: #d4af37; --text: #f0f0f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; }

        /* Navigation Tabs */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--surface); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #1f1f22; z-index: 100; }
        .nav-item { color: #888; font-size: 10px; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }

        /* Content Sections */
        .page { display: none; height: 100vh; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        .active-page { display: block; }

        /* Tycoon UI Elements (Retained) */
        .stat-card { background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid #1f1f22; text-align: center; margin-bottom: 15px; }
        .news-ticker { background: #1a1a1d; padding: 10px; border-radius: 8px; border-left: 3px solid var(--gold); margin-bottom: 15px; font-size: 12px; }
        button { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-weight: 800; }
        
        #authScreen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
    </style>
</head>
<body>

    <div id="authScreen">
        <div style="background:var(--surface); padding:35px; border-radius:20px; border:1px solid #1f1f22; width:90%; max-width:380px; text-align:center;">
            <h1 style="letter-spacing:4px; margin-bottom:20px;">RED<span style="color:var(--accent)">X</span></h1>
            <input type="email" id="email" placeholder="Tycoon Email" style="width:100%; padding:15px; background:#000; border:1px solid #333; color:#fff; border-radius:12px; margin-bottom:15px;">
            <input type="password" id="password" placeholder="Secure Password" style="width:100%; padding:15px; background:#000; border:1px solid #333; color:#fff; border-radius:12px; margin-bottom:15px;">
            <button onclick="handleAuth('login')">ENTER NETWORK</button>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        
        <div id="tab-dash" class="page active-page">
            <h2 style="margin-bottom:20px;">Dashboard</h2>
            <div class="stat-card">
                <p style="font-size:10px; color:#888;">ACTIVE TRADES</p>
                <h2 id="tradeCount" style="color:var(--gold);">492</h2>
            </div>
            <div class="stat-card">
                <p style="font-size:10px; color:#888;">STRATEGIC PLAN</p>
                <h2 style="color:var(--accent);">PREMIUM</h2>
            </div>
            <div class="news-ticker">Live News: Bitcoin hits new high...</div>
        </div>

        <div id="tab-pulse" class="page">
            <h2>Pulse Feed</h2>
            <p style="font-size:12px; color:#888; margin-bottom:15px;">Broadcast your strategy with media.</p>
            <button style="background:#222; margin-bottom:15px;">+ Post Photo/Video</button>
            <div id="pulseFeed"></div>
        </div>

        <div id="tab-ai" class="page">
            <h2>RED X AI (RX-I)</h2>
            <div style="background:var(--surface); height:300px; border-radius:15px; padding:15px; margin-top:20px; border:1px solid #1f1f22;">
                <p style="color:var(--gold);">RX-I: Ready to analyze, Raz.</p>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('tab-dash', this)">📊<br>DASH</div>
            <div class="nav-item" onclick="switchTab('tab-pulse', this)">📱<br>PULSE</div>
            <div class="nav-item" onclick="switchTab('tab-ai', this)">🤖<br>RX-I</div>
            <div class="nav-item" onclick="logout()">🚪<br>EXIT</div>
        </nav>
    </div>

    <script>
        // Firebase Config (Keep yours same)
        const firebaseConfig = {
            apiKey: "AIzaSyAKEjsvgdp9qfyrzo1qP0di4Fscn8iSKaw",
            authDomain: "red-x-global.firebaseapp.com",
            projectId: "red-x-global",
            databaseURL: "https://red-x-global-default-rtdb.firebaseio.com",
            storageBucket: "red-x-global.firebasestorage.app",
            messagingSenderId: "831636783622",
            appId: "1:831636783622:web:92271605a0dc5150123987"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Switch Tabs Function
        function switchTab(tabId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active-page');
            el.classList.add('active');
        }

        // Auth Logic (Retained)
        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        function handleAuth(type) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }
        function logout() { auth.signOut(); }
    </script>
</body>
</html>
