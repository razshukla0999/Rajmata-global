<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDX | GLOBAL EMPIRE</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <style>
        :root { --redx: #ff0000; --bg: #000; --grey: #262626; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }
        .screen { display: none; height: 100vh; flex-direction: column; }
        .active { display: flex; }
        #login-screen { justify-content: center; align-items: center; padding: 40px; }
        .logo { font-size: 4rem; font-weight: 900; color: var(--redx); margin-bottom: 40px; }
        .btn { width: 100%; max-width: 320px; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .google-btn { background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; }
        #feed-container::-webkit-scrollbar { display: none; }
        .reel { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        nav { height: 60px; border-top: 1px solid var(--grey); display: flex; justify-content: space-around; align-items: center; background: #000; }
        .nav-icon { font-size: 1.6rem; color: #666; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="logo">REDX</div>
        <button class="btn google-btn" onclick="core.login()">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="18"> Continue with Google
        </button>
    </div>

    <div id="app-screen" class="screen">
        <div id="feed-container"></div>
        <nav>
            <div class="nav-icon" style="color:#fff">🏠</div>
            <div class="nav-icon">🔍</div>
            <div class="nav-icon">👤</div>
        </nav>
    </div>

    <script>
        // 🔱 TERI ASALI KEYS (From Screenshot 374)
        const firebaseConfig = {
            apiKey: "AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
            authDomain: "red-x-global.firebaseapp.com",
            databaseURL: "https://red-x-global-default-rtdb.firebaseio.com",
            projectId: "red-x-global",
            storageBucket: "red-x-global.firebasestorage.app",
            messagingSenderId: "TUMHARA_SENDER_ID", // <-- Photo mein niche reh gaya, wahan se dekh kar dalo
            appId: "TUMHARI_APP_ID" // <-- Photo mein niche reh gaya, wahan se dekh kar dalo
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const core = {
            videos: [
                { url: 'https://v.redd.it/2z9v6p5f5m6c1/DASH_720.mp4', user: 'raz_king' },
                { url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', user: 'empire_vibe' }
            ],
            login: function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).then(() => {
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('app-screen').classList.add('active');
                    this.render();
                });
            },
            render: function() {
                const container = document.getElementById('feed-container');
                container.innerHTML = this.videos.map(v => `
                    <div class="reel">
                        <video loop playsinline><source src="${v.url}" type="video/mp4"></video>
                        <div style="position:absolute; bottom:80px; left:20px;"><b>@${v.user}</b></div>
                    </div>
                `).join('');
                this.initObserver();
            },
            initObserver: function() {
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => { if(e.isIntersecting) e.target.querySelector('video').play(); else e.target.querySelector('video').pause(); });
                }, { threshold: 0.8 });
                document.querySelectorAll('.reel').forEach(r => obs.observe(r));
            }
        };
    </script>
</body>
</html>
