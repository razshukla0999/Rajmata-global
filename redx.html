<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDX</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#reels{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;position:relative;scroll-snap-align:start}
video{width:100%;height:100%;object-fit:cover}
.sidebar{position:absolute;right:10px;bottom:120px}
.btn{font-size:28px;margin:15px;cursor:pointer}
.overlay{position:absolute;bottom:90px;left:15px}
#login{position:fixed;inset:0;background:#000d;display:flex;justify-content:center;align-items:center}
.card{background:#111;padding:30px;border-radius:15px;text-align:center}
</style>
</head>

<body>

<div id="reels"></div>

<div id="login">
<div class="card">
<h2 style="color:red">REDX</h2>
<button onclick="login()">Continue with Google</button>
<p onclick="skip()">Skip</p>
</div>
</div>

<script>

/* FIREBASE */

firebase.initializeApp({
apiKey:"AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
authDomain:"red-x-global.firebaseapp.com",
projectId:"red-x-global",
});

const auth=firebase.auth();
const db=firebase.firestore();

/* LOGIN FIX (REDIRECT METHOD) */

function login(){
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithRedirect(provider);
}

auth.getRedirectResult().catch(()=>{});

/* LOGIN STATE */

auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("login").style.display="none";
}
});

/* SKIP MODE */

function skip(){
document.getElementById("login").style.display="none";
}

/* REELS ENGINE */

const vids=[
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
];

const container=document.getElementById("reels");

for(let i=0;i<20;i++){
container.innerHTML+=`
<div class="reel">
<video muted loop playsinline>
<source src="${vids[i%3]}" type="video/mp4">
</video>

<div class="sidebar">
<div class="btn" onclick="like('r${i}',this)">🤍</div>
</div>

<div class="overlay">
<b>Trader_${i}</b>
<p>Discipline builds empires 🚀</p>
</div>
</div>`;
}

/* AUTOPLAY */

const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
const v=e.target.querySelector("video");
if(e.isIntersecting){
v.play().catch(()=>{});
}else v.pause();
});
},{threshold:.7});

document.querySelectorAll(".reel")
.forEach(r=>observer.observe(r));

/* LIKE SYSTEM */

async function like(id,el){

const user=auth.currentUser;
if(!user){
alert("Login required");
return;
}

const ref=db.collection("likes")
.doc(id+"_"+user.uid);

const d=await ref.get();

if(d.exists){
await ref.delete();
el.innerText="🤍";
}else{
await ref.set({time:Date.now()});
el.innerText="❤️";
}
}

</script>
</body>
</html>
