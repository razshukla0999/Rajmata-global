<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REDX | THE TRADING EMPIRE</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>

<style>
:root{--redx:#ff0000;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Segoe UI;height:100vh;overflow:hidden}

/* REELS */
#reels-container{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}
#reels-container::-webkit-scrollbar{display:none}

.reel{
height:100vh;
width:100%;
position:relative;
scroll-snap-align:start;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */
.reel-overlay{
position:absolute;
bottom:90px;
left:15px;
right:80px;
z-index:10;
text-shadow:0 2px 10px #000;
}

.user{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.user img{
width:36px;
height:36px;
border-radius:50%;
border:2px solid var(--redx);
}

/* SIDEBAR */
.sidebar{
position:absolute;
right:12px;
bottom:110px;
display:flex;
flex-direction:column;
gap:20px;
z-index:20;
text-align:center;
}

.action{
font-size:26px;
cursor:pointer;
}

/* NAVBAR */
nav{
position:fixed;
bottom:0;
width:100%;
height:65px;
background:linear-gradient(transparent,#000);
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #111;
}

.nav-btn{
font-size:24px;
opacity:.6;
cursor:pointer;
}
.nav-btn.active{opacity:1}

/* LOGIN */
#login{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:999;
}

.card{
background:#111;
padding:35px;
border-radius:20px;
text-align:center;
width:85%;
max-width:320px;
border:1px solid #333;
}

.btn{
margin-top:20px;
padding:14px;
width:100%;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div id="reels-container"></div>

<nav>
<div class="nav-btn active">🏠</div>
<div class="nav-btn" onclick="showLogin()">🔍</div>
<div class="nav-btn" onclick="showLogin()" style="color:red">➕</div>
<div class="nav-btn" onclick="showLogin()">👤</div>
</nav>

<!-- LOGIN -->
<div id="login">
<div class="card">
<h2 style="color:red">REDX</h2>
<p style="color:#888">Join The Trading Empire</p>

<button class="btn" onclick="loginGoogle()">
Continue with Google
</button>

<p onclick="hideLogin()" style="margin-top:15px;color:#555;cursor:pointer">
Skip
</p>
</div>
</div>

<script>
/* ================= FIREBASE ================= */

const firebaseConfig={
apiKey:"AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
authDomain:"red-x-global.firebaseapp.com",
projectId:"red-x-global",
storageBucket:"red-x-global.firebasestorage.app",
messagingSenderId:"831636783622",
appId:"1:831636783622:web:92271605a0dc5150123987"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

/* ================= LOGIN ================= */

function showLogin(){
document.getElementById("login").style.display="flex";
}

function hideLogin(){
document.getElementById("login").style.display="none";
}

function loginGoogle(){
const provider=new firebase.auth.GoogleAuthProvider();

auth.signInWithPopup(provider)
.then(res=>{

const user=res.user;

localStorage.setItem("redxUser",
JSON.stringify({
name:user.displayName,
photo:user.photoURL,
uid:user.uid
}));

hideLogin();

})
.catch(e=>alert(e.message));
}

auth.onAuthStateChanged(user=>{
if(!user){
setTimeout(showLogin,2000);
}
});

/* ================= REELS ENGINE ================= */

const videos=[
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
"http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
];

const container=document.getElementById("reels-container");

/* CREATE REELS */
for(let i=0;i<25;i++){

let v=videos[i%videos.length];

container.innerHTML+=`
<div class="reel">
<video loop playsinline muted preload="metadata">
<source src="${v}" type="video/mp4">
</video>

<div class="sidebar">
<div class="action">❤️</div>
<div class="action">💬</div>
<div class="action">✈️</div>
<div class="action">🔖</div>
</div>

<div class="reel-overlay">
<div class="user">
<img src="https://ui-avatars.com/api/?name=Trader${i}">
<b>Trader_${i}</b>
</div>
<p>Live Market Analysis 🚀 #REDX</p>
</div>

</div>`;
}

/* AUTO PLAY SYSTEM */
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
const video=entry.target.querySelector("video");

if(entry.isIntersecting){
video.play().catch(()=>{});
video.muted=false;
}else{
video.pause();
}
});
},{threshold:.75});

document.querySelectorAll(".reel")
.forEach(r=>observer.observe(r));

</script>

</body>
</html>
