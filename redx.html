<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REDX TycoonOS</title>

<style>
/* =========================
   GLOBAL STYLE
========================= */

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#0b0f1a;
    color:white;
    overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    height:40px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #222;
}

#clock{
    font-size:14px;
}

/* =========================
   DESKTOP
========================= */

#desktop{
    position:absolute;
    top:40px;
    bottom:50px;
    left:0;
    right:0;
    padding:20px;
}

/* =========================
   ICON
========================= */

.icon{
    width:80px;
    text-align:center;
    cursor:pointer;
    margin-bottom:20px;
}

.icon img{
    width:48px;
}

/* =========================
   TASKBAR
========================= */

#taskbar{
    position:absolute;
    bottom:0;
    height:50px;
    width:100%;
    background:#111827;
    display:flex;
    align-items:center;
    padding:0 10px;
    border-top:1px solid #222;
}

#startBtn{
    background:#2563eb;
    border:none;
    color:white;
    padding:8px 15px;
    cursor:pointer;
}

/* =========================
   WINDOW
========================= */

.window{
    position:absolute;
    width:500px;
    height:350px;
    background:#1f2937;
    border:1px solid #333;
    display:none;
    flex-direction:column;
}

.window-header{
    background:#111827;
    padding:8px;
    cursor:move;
    display:flex;
    justify-content:space-between;
}

.window-body{
    flex:1;
    padding:10px;
    overflow:auto;
}

/* =========================
   START MENU
========================= */

#startMenu{
    position:absolute;
    bottom:50px;
    left:10px;
    width:220px;
    background:#1f2937;
    border:1px solid #333;
    display:none;
}

.menu-item{
    padding:10px;
    cursor:pointer;
}

.menu-item:hover{
    background:#374151;
}
</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<div id="topbar">
    <div>REDX TycoonOS</div>
    <div id="clock"></div>
</div>

<!-- ================= DESKTOP ================= -->
<div id="desktop">

    <div class="icon" onclick="openWindow('notesWin')">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
        <div>Notes</div>
    </div>

    <div class="icon" onclick="openWindow('browserWin')">
        <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png">
        <div>Browser</div>
    </div>

</div>

<!-- ================= WINDOWS ================= -->

<div class="window" id="notesWin">
    <div class="window-header">
        Notes
        <button onclick="closeWindow('notesWin')">X</button>
    </div>
    <div class="window-body">
        <textarea style="width:100%;height:100%;background:#111;color:white;border:none;"></textarea>
    </div>
</div>

<div class="window" id="browserWin">
    <div class="window-header">
        Mini Browser
        <button onclick="closeWindow('browserWin')">X</button>
    </div>
    <div class="window-body">
        <input id="urlBox" placeholder="Enter URL..." style="width:80%">
        <button onclick="loadSite()">Go</button>
        <iframe id="browserFrame" style="width:100%;height:85%;border:none;"></iframe>
    </div>
</div>

<!-- ================= START MENU ================= -->

<div id="startMenu">
    <div class="menu-item" onclick="openWindow('notesWin')">Notes</div>
    <div class="menu-item" onclick="openWindow('browserWin')">Browser</div>
</div>

<!-- ================= TASKBAR ================= -->

<div id="taskbar">
    <button id="startBtn" onclick="toggleStart()">Start</button>
</div>

<!-- ================= SCRIPT ================= -->

<script>

/* ================= CLOCK ================= */

function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerText =
        now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* ================= START MENU ================= */

function toggleStart(){
    const menu = document.getElementById("startMenu");
    menu.style.display =
        menu.style.display==="block" ? "none":"block";
}

/* ================= WINDOWS ================= */

function openWindow(id){
    document.getElementById(id).style.display="flex";
}

function closeWindow(id){
    document.getElementById(id).style.display="none";
}

/* ================= MINI BROWSER ================= */

function loadSite(){
    let url=document.getElementById("urlBox").value;

    if(!url.startsWith("http")){
        url="https://"+url;
    }

    document.getElementById("browserFrame").src=url;
}

/* ================= DRAG WINDOW ================= */

document.querySelectorAll(".window").forEach(win=>{
    let isDragging=false,offsetX,offsetY;

    const header=win.querySelector(".window-header");

    header.onmousedown=(e)=>{
        isDragging=true;
        offsetX=e.clientX-win.offsetLeft;
        offsetY=e.clientY-win.offsetTop;
    };

    document.onmousemove=(e)=>{
        if(isDragging){
            win.style.left=(e.clientX-offsetX)+"px";
            win.style.top=(e.clientY-offsetY)+"px";
        }
    };

    document.onmouseup=()=>isDragging=false;
});

</script>

</body>
</html>
