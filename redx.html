<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDX | GLOBAL EMPIRE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

    <style>
        :root { --redx: #ff0000; --bg: #000; --grey: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* Navigation */
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(0,0,0,0.9); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { font-size: 1.5rem; color: #555; cursor: pointer; }
        .nav-item.active { color: #fff; }

        /* Reels Container */
        #feed-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        #feed-container::-webkit-scrollbar { display: none; }
        .reel { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .reel-overlay { position: absolute; bottom: 85px; left: 15px; z-index: 10; width: 80%; }
        .sidebar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; }

        /* Login Modal (Hidden by default) */
        #login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .google-btn { background: #fff; color: #000; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="feed-container"></div>

    <nav>
        <div class="nav-item active">🏠</div>
        <div class="nav-item">🔍</div>
        <div class="nav-item" onclick="core.checkLoginForAction()">➕</div>
        <div class="nav-item" onclick="core.showLogin()">👤</div>
    </nav>

    <div id="login-modal">
        <h1 style="color:var(--redx); font-size: 3rem; margin-bottom: 20px;">REDX</h1>
        <p style="margin-bottom: 30px;">Login to Join the Empire</p>
        <button class="google-btn" onclick="core.login()">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20"> CONTINUE WITH GOOGLE
        </button>
        <p onclick="document.getElementById('login-modal').style.display='none'" style="margin-top:20px; color:#666; cursor:pointer;">Cancel</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
            authDomain: "red-x-global.firebaseapp.com",
            projectId: "red-x-global",
            storageBucket: "red-x-global.firebasestorage.app",
            messagingSenderId: "831636783622",
            appId: "1:831636783622:web:92271605a0dc5150123987"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const core = {
            // Test Content (YouTube Shorts Style)
            reels: [
                { user: 'RedX_Official', desc: 'Welcome to the Trading Empire 🔱', url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4' },
                { user: 'Nifty_Hunter', desc: 'Price Action at its best! 🔥', url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' }
            ],

            init: function() {
                this.renderReels();
                this.setupVideoObserver();
            },

            renderReels: function() {
                const container = document.getElementById('feed-container');
                container.innerHTML = this.reels.map(r => `
                    <div class="reel">
                        <video loop playsinline muted onclick="this.paused ? this.play() : this.pause()">
                            <source src="${r.url}" type="video/mp4">
                        </video>
                        <div class="reel-overlay">
                            <h3 style="color:var(--redx)">@${r.user}</h3>
                            <p>${r.desc}</p>
                        </div>
                        <div class="sidebar">
                            <div style="font-size:2rem">❤️</div>
                            <div style="font-size:2rem">💬</div>
                        </div>
                    </div>
                `).join('');
            },

            setupVideoObserver: function() {
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        const v = e.target.querySelector('video');
                        if(e.isIntersecting) { v.play().catch(()=>{}); v.muted = false; }
                        else { v.pause(); }
                    });
                }, { threshold: 0.8 });
                document.querySelectorAll('.reel').forEach(reel => obs.observe(reel));
            },

            showLogin: function() {
                document.getElementById('login-modal').style.display = 'flex';
            },

            checkLoginForAction: function() {
                if(!auth.currentUser) {
                    this.showLogin();
                } else {
                    alert("Ready to upload!");
                }
            },

            login: function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).then(() => {
                    location.reload(); // Reload to refresh state
                }).catch(err => alert("Error: " + err.message));
            }
        };

        core.init();
    </script>
</body>
</html>
