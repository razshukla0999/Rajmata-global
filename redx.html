<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDX | THE TRADING EMPIRE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>

    <style>
        :root { --redx: #ff0000; --glass: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; height: 100vh; overflow: hidden; }

        /* Full Screen Reel Engine */
        #reels-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        #reels-container::-webkit-scrollbar { display: none; }

        .reel {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Instagram Style */
        }

        /* UI Overlays */
        .reel-overlay {
            position: absolute;
            bottom: 80px;
            left: 15px;
            right: 70px;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .user-tag { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .user-tag img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--redx); }
        .user-tag h4 { font-size: 0.95rem; font-weight: 600; }

        .description { font-size: 0.85rem; line-height: 1.3; opacity: 0.9; }

        /* Sidebar Actions (Instagram Style) */
        .sidebar {
            position: absolute;
            right: 12px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            z-index: 20;
        }
        .action-item { text-align: center; cursor: pointer; }
        .action-item span { font-size: 28px; display: block; margin-bottom: 4px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
        .action-item p { font-size: 11px; font-weight: 600; }

        /* Bottom Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 65px;
            background: linear-gradient(transparent, #000);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .nav-btn { font-size: 24px; color: #fff; opacity: 0.6; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { opacity: 1; transform: scale(1.1); }

        /* Login Modal */
        #login-gate {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .login-card {
            background: #111;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid #333;
            width: 85%;
            max-width: 350px;
        }
        .login-card h2 { color: var(--redx); font-size: 2.5rem; margin-bottom: 10px; letter-spacing: -1px; }
        .g-btn {
            background: #fff; color: #000; border: none; padding: 14px;
            border-radius: 12px; font-weight: bold; width: 100%;
            margin-top: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
    </style>
</head>
<body>

    <div id="reels-container"></div>

    <nav>
        <div class="nav-btn active">🏠</div>
        <div class="nav-btn" onclick="ui.showLogin()">🔍</div>
        <div class="nav-btn" onclick="ui.showLogin()" style="color:var(--redx)">➕</div>
        <div class="nav-btn" onclick="ui.showLogin()">👤</div>
    </nav>

    <div id="login-gate">
        <div class="login-card">
            <h2>REDX</h2>
            <p style="color:#888; font-size: 14px;">Master the Markets. Join the Empire.</p>
            <button class="g-btn" onclick="authManager.login()">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="18">
                Continue with Google
            </button>
            <p onclick="ui.hideLogin()" style="margin-top:20px; color:#555; cursor:pointer; font-size: 13px;">Skip for now</p>
        </div>
    </div>

    <script>
        // 🔱 FIREBASE SHIELD (Your Verified Config)
        const firebaseConfig = {
            apiKey: "AIzaSyAKEjsvgdp9qfyrzo1qP0di4fscn8iSKaw",
            authDomain: "red-x-global.firebaseapp.com",
            projectId: "red-x-global",
            storageBucket: "red-x-global.firebasestorage.app",
            messagingSenderId: "831636783622",
            appId: "1:831636783622:web:92271605a0dc5150123987"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 🔱 TRADING REELS ENGINE (Infinite Pool)
        const tradingContent = [
            { user: 'Nifty_Elite', desc: 'Price Action at 9:15 AM 🔥 #Trading #Nifty', video: 'https://v16-webapp.tiktokcdn-us.com/...' }, // Placeholder for logic
            { user: 'Chart_Master', desc: 'Discipline is the only secret. 🔱', video: '...' }
        ];

        // High-Quality Global Trading Video Links (Stable CDNs)
        const stableVideos = [
            "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
            "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
            "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
        ];

        const ui = {
            init: function() {
                this.renderInfiniteFeed();
                this.setupVideoLogic();
            },

            renderInfiniteFeed: function() {
                const container = document.getElementById('reels-container');
                // Creating 20 initial reels for a smooth start
                for(let i=0; i<20; i++) {
                    const videoUrl = stableVideos[i % stableVideos.length];
                    const userName = `Trader_Ex_${i+1}`;
                    container.innerHTML += `
                        <div class="reel">
                            <video loop playsinline muted onclick="this.paused ? this.play() : this.pause()">
                                <source src="${videoUrl}" type="video/mp4">
                            </video>
                            <div class="sidebar">
                                <div class="action-item"><span>❤️</span><p>${(Math.random()*50).toFixed(1)}k</p></div>
                                <div class="action-item"><span>💬</span><p>${Math.floor(Math.random()*500)}</p></div>
                                <div class="action-item"><span>✈️</span></div>
                                <div class="action-item"><span>🔖</span></div>
                            </div>
                            <div class="reel-overlay">
                                <div class="user-tag">
                                    <img src="https://ui-avatars.com/api/?name=${userName}&background=random">
                                    <h4>${userName} • Follow</h4>
                                </div>
                                <p class="description">Live Market Analysis: Testing the support at 21800. Watch till the end! 🚀 #StockMarket #RedX</p>
                            </div>
                        </div>
                    `;
                }
            },

            setupVideoLogic: function() {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        const video = entry.target.querySelector('video');
                        if (entry.isIntersecting) {
                            video.play().catch(() => {});
                            video.muted = false; // Auto-unmute on scroll
                        } else {
                            video.pause();
                        }
                    });
                }, { threshold: 0.8 });

                document.querySelectorAll('.reel').forEach(reel => observer.observe(reel));
            },

            showLogin: () => document.getElementById('login-gate').style.display = 'flex',
            hideLogin: () => document.getElementById('login-gate').style.display = 'none'
        };

        const authManager = {
            login: function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).then(() => {
                    location.reload();
                }).catch(err => alert("Empire Login Failed: " + err.message));
            }
        };

        // Start Empire
        ui.init();
    </script>
</body>
</html>
